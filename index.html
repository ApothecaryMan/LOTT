<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Lord Of The Truth" />

    <title>Lord Of The Truth - custom</title>

    <link rel="icon" href="img/favicon.ico" type="image/x-icon" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Alexandria:wght@100..900&family=Arizonia&family=Beiruti:wght@200..900&family=El+Messiri:wght@400..700&family=Felipa&family=Lalezar&family=Lateef:wght@200;300;400;500;600;700;800&family=Playpen+Sans+Arabic:wght@100..800&display=swap"
      rel="stylesheet"
    />

    <!-- ATROPOS LIB -->
    <link rel="stylesheet" href="https://unpkg.com/atropos@2/atropos.min.css" />
    <script src="https://unpkg.com/atropos@2/atropos.min.js"></script>

    <!-- Existing CSS -->
    <link rel="stylesheet" href="css/general.css" />
    <link rel="stylesheet" href="css/header.css" />
    <link rel="stylesheet" href="css/theme.css" />
    <link rel="stylesheet" href="css/main.css" />
    <link rel="stylesheet" href="css/card.css" />
    <link rel="stylesheet" href="css/carousel.css" />
    <link rel="stylesheet" href="css/font.css" />
    <link rel="stylesheet" href="css/chapter-list.css" />
    <link rel="stylesheet" href="css/comments-auth.css" />
    <link rel="stylesheet" href="css/D-Tilt-Hover-Effect.css" />

    <!-- NEW: Desktop Split Layout CSS -->
    <link rel="stylesheet" href="css/desktop-layout.css" />
  </head>

  <body>
    <!-- Header -->
    <div class="header-container" style="background-image: url('img/55.jpg')">
      <header class="header">
        <h2 class="title">Lord Of The Truth</h2>
      </header>
    </div>

    <!-- Carousel -->
    <div class="body">
      <div class="carousel-container">
        <div class="carousel-wrapper">
          <button id="prev-btn" class="carousel-nav-btn">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              height="24px"
              viewBox="0 -960 960 960"
              width="24px"
              fill="white"
            >
              <path d="M560-240 320-480l240-240 56 56-184 184 184 184-56 56Z" />
            </svg>
          </button>
          <div class="carousel" id="carousel">
            <div class="carousel-item" id="title-font">
              <h2 class="title" id="logo">Lord Of The Truth</h2>
            </div>
            <div class="carousel-item">

              <button class="carousel-btn-start" id="comments-btn">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  height="18px"
                  viewBox="0 -960 960 960"
                  width="18px"
                  fill="#000000"
                >
                  <path
                    d="M276-384h408q15.3 0 25.65-10.29Q720-404.58 720-419.79t-10.35-25.71Q699.3-456 684-456H276q-15.3 0-25.65 10.29Q240-435.42 240-420.21t10.35 25.71Q260.7-384 276-384Zm0-132h408q15.3 0 25.65-10.29Q720-536.58 720-551.79t-10.35-25.71Q699.3-588 684-588H276q-15.3 0-25.65 10.29Q240-567.42 240-552.21t10.35 25.71Q260.7-516 276-516Zm0-132h408q15.3 0 25.65-10.29Q720-668.58 720-683.79t-10.35-25.71Q699.3-720 684-720H276q-15.3 0-25.65 10.29Q240-699.42 240-684.21t10.35 25.71Q260.7-648 276-648ZM168-240q-29.7 0-50.85-21.15Q96-282.3 96-312v-480q0-29.7 21.15-50.85Q138.3-864 168-864h624q29.7 0 50.85 21.15Q864-821.7 864-792v609q0 24.19-22 33.59-22 9.41-39.12-7.71L720-240H168Z"
                  />
                </svg>
              </button>

              <button class="carousel-btn-end" id="title-btn"></button>
            </div>

            <div class="carousel-item">
              <button class="carousel-btn-middle" id="word-count"></button>
            </div>

            <div id="font-panel" class="carousel-item">
              <button class="carousel-btn-middle" id="font-panel-btn">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  height="20px"
                  viewBox="0 -960 960 960"
                  width="24px"
                  fill="#e3e3e3"
                >
                  <path
                    d="M480-80q-82 0-155-31.5t-127.5-86Q143-252 111.5-325T80-480q0-83 32.5-156t88-127Q256-817 330-848.5T488-880q80 0 151 27.5t124.5 76q53.5 48.5 85 115T880-518q0 115-70 176.5T640-280h-74q-9 0-12.5 5t-3.5 11q0 12 15 34.5t15 51.5q0 50-27.5 74T480-80Zm0-400Zm-220 40q26 0 43-17t17-43q0-26-17-43t-43-17q-26 0-43 17t-17 43q0 26 17 43t43 17Zm120-160q26 0 43-17t17-43q0-26-17-43t-43-17q-26 0-43 17t-17 43q0 26 17 43t43 17Zm200 0q26 0 43-17t17-43q0-26-17-43t-43-17q-26 0-43 17t-17 43q0 26 17 43t43 17Zm120 160q26 0 43-17t17-43q0-26-17-43t-43-17q-26 0-43 17t-17 43q0 26 17 43t43 17ZM480-160q9 0 14.5-5t5.5-13q0-14-15-33t-15-57q0-42 29-67t71-25h70q66 0 113-38.5T800-518q0-121-92.5-201.5T488-800q-136 0-232 93t-96 227q0 133 93.5 226.5T480-160Z"
                  />
                </svg>
              </button>
            </div>
          </div>
          <button id="next-btn" class="carousel-nav-btn">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              height="24px"
              viewBox="0 -960 960 960"
              width="24px"
              fill="white"
            >
              <path
                d="M400-240 344-296l184-184-184-184 56-56 240 240-240 240Z"
              />
            </svg>
          </button>
        </div>
      </div>
      <div id="chapter-list-container"></div>
    </div>

    <div id="font-tools-popup" class="font-tools-popup">
      <div class="font-tools-header">
        <!-- <h4>أدوات</h4> -->
        <div id="tools-header">
          <div class="carousel-item" id="color-selector">
            <button class="carousel-btn-start" id="gray"></button>
            <button class="carousel-btn-middle" id="orange"></button>
            <button class="carousel-btn-middle" id="blue"></button>
            <button class="carousel-btn-middle" id="green"></button>
            <button class="carousel-btn-middle" id="pink"></button>
            <button class="carousel-btn-end" id="custom-color-btn"></button>
          </div>
          <div id="mode-selector">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              height="18px"
              viewBox="0 -960 960 960"
              width="24px"
              fill="#000000"
            >
              <path
                d="M480-80q-83 0-156-31.5T197-197q-54-54-85.5-127T80-480q0-83 31.5-156T197-763q54-54 127-85.5T480-880q83 0 156 31.5T763-763q54 54 85.5 127T880-480q0 83-31.5 156T763-197q-54 54-127 85.5T480-80Zm40-83q119-15 199.5-104.5T800-480q0-123-80.5-212.5T520-797v634Z"
              />
            </svg>
          </div>
        </div>
        <button id="close-font-tools-btn" class="close-btn"></button>
      </div>

      <div class="font-tools-content">
        <div id="font-size-control-group" class="font-tool-section">
          <h4>size</h4>
          <input type="range" id="size-slider" min="0" max="7" step="1" />
        </div>
        <div id="align-formate" class="font-tool-section">
          <!-- <h5>محاذاة النص</h5> -->
          <button class="font-tool-btn" id="rtl-btn">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              height="18px"
              viewBox="0 -960 960 960"
              width="24px"
              fill="#000000"
            >
              <path
                d="M120-760v-80h720v80H120Zm240 160v-80h480v80H360ZM120-440v-80h720v80H120Zm240 160v-80h480v80H360ZM120-120v-80h720v80H120Z"
              />
            </svg>
          </button>
          <button class="font-tool-btn" id="middle-btn">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              height="18px"
              viewBox="0 -960 960 960"
              width="24px"
              fill="#000000"
            >
              <path
                d="M120-120v-80h720v80H120Zm160-160v-80h400v80H280ZM120-440v-80h720v80H120Zm160-160v-80h400v80H280ZM120-760v-80h720v80H120Z"
              />
            </svg>
          </button>
          <button class="font-tool-btn" id="ltr-btn">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              height="18px"
              viewBox="0 -960 960 960"
              width="24px"
              fill="#000000"
            >
              <path
                d="M120-120v-80h720v80H120Zm0-160v-80h480v80H120Zm0-160v-80h720v80H120Zm0-160v-80h480v80H120Zm0-160v-80h720v80H120Z"
              />
            </svg>
          </button>
        </div>
        <div id="font-selector" class="font-tool-section">
          <button
            class="font-tool-btn"
            id="font-alexandria"
            style="font-family: Alexandria; font-weight: 350"
          >
            الاسكندريه
          </button>
          <button
            class="font-tool-btn"
            id="font-el-messiri"
            style="font-family: 'El Messiri', sans-serif"
          >
            المسيري
          </button>
          <button
            class="font-tool-btn"
            id="font-playpen"
            style="font-family: 'Playpen Sans Arabic', cursive"
          >
            بلايبن
          </button>
          <button
            class="font-tool-btn"
            id="font-Ink"
            style="font-family: 'Ink', serif"
          >
            حبر
          </button>

          <button
            class="font-tool-btn"
            id="font-chiwer"
            style="font-family: 'Chiwer', sans-serif"
          >
            شيو
          </button>
          <button
            class="font-tool-btn"
            id="font-fred-fredburger"
            style="font-family: 'Fred Fredburger', sans-serif"
          >
            فريد
          </button>
          <button
            class="font-tool-btn"
            id="font-hagrid"
            style="font-family: 'Hagrid', sans-serif"
          >
            هاجريد
          </button>
          <button
            class="font-tool-btn"
            id="font-iran"
            style="font-family: 'Iran', sans-serif"
          >
            ايران
          </button>

          <button
            class="font-tool-btn"
            id="font-merdane"
            style="font-family: 'Merdane', sans-serif"
          >
            مارديني
          </button>
          <button
            class="font-tool-btn"
            id="font-plex"
            style="font-family: 'Plex', sans-serif"
          >
            بليكس
          </button>

          <button
            class="font-tool-btn"
            id="font-qara"
            style="font-family: 'Qara', sans-serif"
          >
            قارا
          </button>
          <button
            class="font-tool-btn"
            id="font-qelem"
            style="font-family: 'Qelem', sans-serif"
          >
            قلم
          </button>

          <button
            class="font-tool-btn"
            id="font-titr"
            style="font-family: 'titr', sans-serif"
          >
            تيتر
          </button>
        </div>
      </div>
    </div>

    <!-- NEW: Main Content Wrapper for Split Layout -->
    <div class="main-content-wrapper">
      <!-- NEW: Comments Panel (Inline on Desktop, Overlay on Mobile) -->
      <div id="comments-panel">
        <div class="comments-panel-header">
          <h4 class="comments-panel-title">التعليقات</h4>
          <button
            id="close-comments-btn"
            class="comments-panel-close"
            title="إغلاق"
          >
            &times;
          </button>
        </div>
        <div class="comments-container"></div>
      </div>

      <!-- Main Content Area -->
      <div class="main-content-area">
        <div class="main-body">
          <main class="main">
            <div class="main-header-container" id="main-header-container">
              <!-- NEW CARD -->
              <div class="origin">
                <div class="card-container">
                  <div class="card">
                    <img class="card-img" src="img/card.jpg" alt="غلاف القصة" />
                    <div class="card-info">
                      <span class="card-title">لورد الحقيقـــــة</span>
                      <!-- <span class="card-chapter-number">1771</span> -->
                    </div>
                  </div>
                </div>
              </div>
              <div id="story-description-container"></div>
              <div class="main-header"></div>
            </div>
            <!-- NEW: Elements for infinite scroll up -->
            <div id="loading-spinner-top" class="spinner"></div>
            <div id="scroll-start-sentinel"></div>

            <div class="chapter" id="chapter-text"></div>
            <div id="scroll-end-sentinel"></div>
            <div id="loading-spinner" class="spinner"></div>
          </main>

          <div class="info-container">
            <div class="info" id="info-wrapper">
              <div id="expand-info"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <!-- End Main Content Wrapper -->

    <!-- Overlay for Mobile -->
    <div id="comments-overlay"></div>

    <script src="scripts/loader/content-loader.js"></script>
    <script src="scripts/loader/story-loader.js"></script>
    <script src="scripts/color.js"></script>
    <script src="scripts/theme.js"></script>
    <script src="scripts/custom-color-picker.js"></script>
    <script src="scripts/novel-switcher.js"></script>
    <script src="scripts/loader/list-loader.js"></script>
    <script src="scripts/carousel.js"></script>
    <script src="scripts/font.js"></script>
    <script src="scripts/title-animation.js"></script>
    <script src="scripts/script.js"></script>
    <script src="scripts/D-Tilt-Hover-Effect.js"></script>

    <!-- NEW: Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="scripts/comments.js"></script>
  </body>
</html>
