<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Lord Of The Truth" />

  <title>Lord Of The Truth - custom</title>

  <link rel="icon" href="img/favicon.ico" type="image/x-icon" />

  <!-- PWA manifest -->
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#1a1a1a" />
  <link rel="apple-touch-icon" href="/img/icon-512.jpg" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Alexandria:wght@100..900&family=Arizonia&family=Beiruti:wght@200..900&family=El+Messiri:wght@400..700&family=Felipa&family=Lalezar&family=Lateef:wght@200;300;400;500;600;700;800&family=Playpen+Sans+Arabic:wght@100..800&display=swap"
    rel="stylesheet" />

  <!-- ATROPOS LIB -->
  <link rel="stylesheet" href="https://unpkg.com/atropos@2/atropos.min.css" />
  <script src="https://unpkg.com/atropos@2/atropos.min.js"></script>

  <!-- Consolidated CSS -->
  <link rel="stylesheet" href="css/styles.css" />
</head>

<body>
  <div class="card-carousel-container" style="display: block; margin-top: 50px;">
    <button id="card-prev-btn" class="carousel-nav-btn hidden">
      <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="white">
        <path d="M560-240 320-480l240-240 56 56-184 184 184 184-56 56Z" />
      </svg>
    </button>

    <div class="cards" id="card-carousel">
      <!-- Cards will be injected here -->
    </div>

    <button id="card-next-btn" class="carousel-nav-btn hidden">
      <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="white">
        <path d="M400-240 344-296l184-184-184-184 56-56 240 240-240 240Z" />
      </svg>
    </button>
  </div>

  <script src="scripts/carousel.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      try {
        const response = await fetch("novels.json");
        const novels = await response.json();
        const container = document.getElementById("card-carousel");

        novels.forEach(novel => {
          const card = document.createElement("div");
          card.className = "card";
          card.style.minWidth = "200px";
          card.style.width = "200px";
          card.style.cursor = "pointer";

          card.onclick = () => {
            localStorage.setItem("lastOpenNovelId", novel.id);
            window.location.href = "reader.html";
          };

          card.innerHTML = `
              <img class="card-img" src="${novel.image}" alt="${novel.title}" />
              <div class="card-info">
                <span class="card-title js-card-title" style="font-family: 'Ink'; font-size: 23px;">${novel.arTitle}</span>
              </div>
            `;
          container.appendChild(card);
        });
      } catch (error) {
        console.error("Failed to load novels:", error);
      }
    });
  </script>
</body>

</html>
